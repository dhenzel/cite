name = "cite-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Working store: full private dataset lives in D1 (cite-v0, main account).
# Public MCP tools serve whitelisted fields only; /admin/api/* (bearer
# ADMIN_TOKEN secret) is the only surface returning private columns.
# Set the secret before first use:  npx wrangler secret put ADMIN_TOKEN
[[d1_databases]]
binding = "DB"
database_name = "cite-v0"
database_id = "9e822ecc-00fb-4b67-877a-3197e7e9a0de"

[observability]
enabled = true
